<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unity WebGL Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    #unity-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
    }
    #loading-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="loading-bar">Loading...</div>
  </div>

  <!-- Unity loader script -->
  <script src="Build/UnityLoader.js"></script>
  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/UnityLoader.js";
    var config = {
      dataUrl: buildUrl + "/data.unityweb",
      frameworkUrl: buildUrl + "/framework.unityweb",
      codeUrl: buildUrl + "/code.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "YourCompany",
      productName: "YourGame",
      productVersion: "1.0",
    };

    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#loading-bar");

    UnityLoader.instantiate("unity-canvas", loaderUrl, config, function(progress) {
      loadingBar.innerHTML = "Loading... " + Math.round(progress * 100) + "%";
      if (progress >= 1) {
        loadingBar.style.display = "none";
      }
    });
  </script>
</body>
</html>
